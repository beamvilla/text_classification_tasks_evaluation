# Allowlist of models each repository accepts.
# `default` must also be listed in `available`.

[openai]
default = "gpt-4o-mini"
available = [
    "gpt-4o-mini", "gpt-4o",
    "gpt-4.1-nano", "gpt-4.1-mini", "gpt-4.1",
    "gpt-5-nano", "gpt-5-mini", "gpt-5", "gpt-5-pro",
    "gpt-5.1",
    "gpt-5.2", "gpt-5.2-pro",
    "gpt-5.4-nano", "gpt-5.4-mini", "gpt-5.4", "gpt-5.4-pro",
    "gpt-5.5", "gpt-5.5-pro",
    "gpt-5.6-luna", "gpt-5.6-terra", "gpt-5.6-sol",
    "gpt-6-luna", "gpt-6-sol", "gpt-6-astra",
    "gpt-6.1-terra", "gpt-6.1-sol",
]

[typesafe]
default = "jev-latest"
available = ["jev-latest"]
